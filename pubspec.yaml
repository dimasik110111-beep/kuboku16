name: junior_u16
description: JUNIOR U16 FHR scores app
publish_to: 'none'
version: 0.34.0+35
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  share_plus: ^10.1.4
  http: ^1.3.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: ArenaSans
      fonts:
        - asset: assets/fonts/arena/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/arena/OpenSans-Semibold.ttf
          weight: 600
    - family: ArenaCondensed
      fonts:
        - asset: assets/fonts/arena/OpenSans-CondBold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 200
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 800

