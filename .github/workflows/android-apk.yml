name: Build JUNIOR U16 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: junior-u16-v34-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name=junior_u16 --org=ru.junioru16 .
          rm -f test/widget_test.dart
      - name: Configure permanent release signing
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 tools/configure_signing.py
      - name: Use official FHR Cup logo as Android launcher icon
        run: |
          python3 -m pip -q install Pillow
          python3 tools/make_launcher_icon.py
      - name: Enable Android Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check standings and LIVE rules
        run: flutter test
      - name: Capture phone layout
        run: flutter test --dart-define=DESIGN_CAPTURE=true test/design_capture_test.dart
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify permanent signature
        if: steps.signing.outputs.ready == 'true'
        run: python3 tools/verify_signing.py build/app/outputs/flutter-apk/app-release.apk "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUNIOR-U16-v34-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified v34 APK
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JUNIOR-U16-v34.apk
          sha256sum JUNIOR-U16-v34.apk > SHA256SUMS.txt
          if gh release view v34.0.0 >/dev/null 2>&1; then
            gh release upload v34.0.0 JUNIOR-U16-v34.apk SHA256SUMS.txt --clobber
            gh release edit v34.0.0 --target "$GITHUB_SHA" --title "JUNIOR U16 v34 · ICE SIGNAL" --notes-file RELEASE_NOTES_v34.md
          else
            gh release create v34.0.0 JUNIOR-U16-v34.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "JUNIOR U16 v34 · ICE SIGNAL" --notes-file RELEASE_NOTES_v34.md
          fi
      - name: Explain skipped publication
        if: steps.signing.outputs.ready != 'true'
        run: echo 'APK is for CI validation only. Configure ANDROID_SIGNING_BUNDLE to publish a permanent-signature release.'
