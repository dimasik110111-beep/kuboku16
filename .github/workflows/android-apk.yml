name: Build JUNIOR U16 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: junior-u16-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name=junior_u16 --org=ru.junioru16 .
          # Flutter template creates a MyApp test which does not apply to JUNIOR U16
          rm -f test/widget_test.dart
      - name: Enable Android Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check standings and LIVE rules
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUNIOR-U16-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
