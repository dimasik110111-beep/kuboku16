name: Build JUNIOR U16 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: junior-u16-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name=junior_u16 --org=ru.junioru16 .
          # Flutter template creates a MyApp test which does not apply to JUNIOR U16
          rm -f test/widget_test.dart
      - name: Use official FHR Cup logo as Android launcher icon
        run: |
          python3 -m pip -q install Pillow
          python3 tools/make_launcher_icon.py
      - name: Enable Android Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check standings and LIVE rules
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUNIOR-U16-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified v15 APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JUNIOR-U16-v15.apk
          sha256sum JUNIOR-U16-v15.apk > SHA256SUMS.txt
          if gh release view v15.0.0 >/dev/null 2>&1; then
            gh release upload v15.0.0 JUNIOR-U16-v15.apk SHA256SUMS.txt --clobber
            gh release edit v15.0.0 --notes-file RELEASE_NOTES_v15.md
          else
            gh release create v15.0.0 JUNIOR-U16-v15.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "JUNIOR U16 v15 · Большое обновление" --notes-file RELEASE_NOTES_v15.md
          fi
