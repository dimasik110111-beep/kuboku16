name: Verify FHR squads and images API
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-teams-api.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://kubok-u16-live.dimasik110111.workers.dev'
          def get(p):
              with urllib.request.urlopen(urllib.request.Request(base+p,headers={'User-Agent':'JuniorU16-Check'}),timeout=45) as response:
                  return json.load(response)
          teams=get('/api/v1/teams')
          print('TEAM COUNT',teams.get('count'),'COMPLETE',teams.get('complete'),flush=True)
          print('LOGOS',[(t.get('fullName'),t.get('logo')) for t in teams.get('teams',[])],flush=True)
          assert teams.get('count') == 20,'Need all 20 official teams'
          assert all((t.get('logo') or '').startswith('https://img.fhr.ru/teams/') for t in teams.get('teams',[])),'Missing club crests'
          team=teams['teams'][0]
          roster=get('/api/v1/teams/'+str(team['id']))
          print('ROSTER',team['fullName'],roster.get('playersCount'),roster.get('players',[])[:2],flush=True)
          assert roster.get('playersCount',0)>=15,'Incomplete roster'
          assert any((p.get('photo') or '').startswith('https://img.fhr.ru/players/') for p in roster.get('players',[])),'No official player portraits'
          PY
