name: Inspect FHR timeline structured
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-protocol-summary.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -m pip -q install beautifulsoup4
          python3 - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup
          u='https://junior.fhr.ru/games/25170469/'
          soup=BeautifulSoup(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read(),'html.parser')
          for k,el in enumerate(soup.select('.match-protocol')):
            if k>=24:break
            center=el.select_one('.match-protocol__center')
            info={}
            for side in ['left','right']:
              child=el.select_one('.match-protocol__'+side)
              if child:
                info[side]=dict(name=(child.select_one('.protocol-player-card__name') or child).get_text(' ',strip=True)[:70],
                  team=(child.select_one('.protocol-player-card__name-team') or child).get_text(' ',strip=True)[:70],
                  reason=(child.select_one('.protocol-player-card__label') or child).get_text(' ',strip=True)[:80],
                  minutes=(child.select_one('.protocol-player-card__sidebar') or child).get_text(' ',strip=True)[:40])
            print('TIMELINE',k,el.get('class'),'CENTER',center.get_text(' ',strip=True)[:100] if center else None,'SIDES',info,flush=True)
          for el in soup.select('.match-protocol-tab table, .match-stat-tab table,.match-statistic table,.statistic-tab table')[:8]:
            print('TABLE',el.get('class'),el.get_text(' ',strip=True)[:400],flush=True)
          print('ALL_TABS',[(x.get('data-tab-name'),x.get_text(' ',strip=True)[:80]) for x in soup.select('.tabs-title')][:20],flush=True)
          PY
