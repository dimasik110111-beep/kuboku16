name: Publish JUNIOR U16 v11 direct APK download

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v11.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified APK artifact from successful v11 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13545280494/zip"             --output app-artifact.zip
          unzip -q app-artifact.zip
          test -f app-release.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          path=Path('app-release.apk')
          assert path.stat().st_size>40_000_000
          expected='0ba83a344a90102a21b0398f2602730f9568cdae0d70066e8e4517180bb06e2b'
          assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, 'APK checksum mismatch'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert 'classes.dex' in archive.namelist()
          print('Verified original Android APK:',path.stat().st_size,'bytes')
          PY
          mv app-release.apk JUNIOR-U16-v11.apk
      - name: Publish direct-download GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v11.0.0 >/dev/null 2>&1; then
            gh release upload v11.0.0 JUNIOR-U16-v11.apk --clobber
          else
            gh release create v11.0.0 JUNIOR-U16-v11.apk               --title "JUNIOR U16 v11 - Android APK"               --notes "Test build: native FHR match center and redesigned dark UI. Source: junior.fhr.ru. This APK has not been fully tested on all Android devices. If update fails due to signing, uninstall previous version first (local data may be lost)."               --prerelease
          fi
      - name: Check release URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v11.0.0 --json assets,url,isPrerelease
          gh release download v11.0.0 --pattern 'JUNIOR-U16-v11.apk' --dir verified
          test -s verified/JUNIOR-U16-v11.apk
