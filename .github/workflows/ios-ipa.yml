name: Build JUNIOR U16 iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: junior-u16-ios
  cancel-in-progress: false

jobs:
  ios:
    name: Build iOS release (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS platform
        run: |
          flutter create --platforms=ios --project-name=junior_u16 --org=ru.junioru16 .
          rm -f test/widget_test.dart
      - name: Set iPhone app metadata
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName JUNIOR U16" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads false" ios/Runner/Info.plist 2>/dev/null || true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos
      - name: Test application
        run: flutter test
      - name: Compile real iPhone release
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload JUNIOR-U16-v24-unsigned.ipa
          unzip -t JUNIOR-U16-v24-unsigned.ipa | tail -1
          shasum -a 256 JUNIOR-U16-v24-unsigned.ipa > SHA256SUMS-iOS.txt
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUNIOR-U16-v24-unsigned-iOS
          path: |
            build/ios/ipa/JUNIOR-U16-v24-unsigned.ipa
            build/ios/ipa/SHA256SUMS-iOS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Attach unsigned IPA to existing v24 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v24.0.0 build/ios/ipa/JUNIOR-U16-v24-unsigned.ipa build/ios/ipa/SHA256SUMS-iOS.txt --clobber
      - name: Explain iPhone installation limitation
        run: |
          echo 'This IPA contains a compiled iOS app but is NOT signed with Apple Distribution certificates.'
          echo 'It will not install normally on an iPhone until a valid provisioning profile and Apple signing certificate are configured.'
